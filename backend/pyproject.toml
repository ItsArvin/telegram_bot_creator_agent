[project]
name = "agentic-telegram-bot-builder-backend"
version = "0.2.0"
description = "FastAPI control-plane backend for the Agentic Telegram Bot Builder"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "email-validator>=2.2,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.16,<2.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "httpx>=0.28,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "langchain>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "vercel>=0.2,<1.0",
  "psycopg[binary]>=3.2,<4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
